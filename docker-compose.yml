services:
  web:
    build: .
    image: revocation-dir:latest
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080。
      - "${HOST_PORT:-8080}:8000"
    environment:
      APP_DB: /data/directory.db
      APP_PORT: "8000"
    volumes:
      - directory-data:/data
    restart: unless-stopped

  # 一次性验收服务：执行完毕即以退出码报告结果（0=通过）。
  # 运行：docker compose run --rm verify
  verify:
    build: .
    image: revocation-dir:latest
    command: ["python", "-m", "app.verify"]
    environment:
      BASE_URL: http://web:8000
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

volumes:
  directory-data:
